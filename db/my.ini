# MySQL/MariaDB configuration for this project's own database server.
#
# scripts/mysql-server.js starts mysqld with `--defaults-file` pointing here,
# which means this is the ONLY config file read -- XAMPP's my.ini is ignored, so
# nothing here can affect the databases in your XAMPP install, and nothing there
# can affect this one.
#
# Machine-specific paths (basedir, datadir, port) are deliberately absent: they
# differ per checkout, so the launcher passes them on the command line, where
# they take precedence over anything in a config file. That keeps this file
# committable and identical on every machine.

[client]
default-character-set=utf8mb4

[mysql]
default-character-set=utf8mb4

[mysqld]
# Listen on loopback only. This database holds scraped contact details; there is
# no reason for it to be reachable from the network.
bind-address=127.0.0.1

character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# XAMPP's stock my.ini is tuned for a machine with 64MB of RAM. Re-ingesting the
# archive under those defaults spends all its time writing index pages to disk.
innodb_buffer_pool_size=256M
innodb_log_buffer_size=16M
innodb_log_file_size=64M
innodb_flush_log_at_trx_commit=1

# Contact bios and the merged search blob are long; 1MB (the stock value) is not
# enough for a bulk insert or for restoring a dump.
max_allowed_packet=64M

# Matches the SQL mode the app was developed against.
sql_mode=NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION

log_error=mysql_error.log

[mysqldump]
default-character-set=utf8mb4
max_allowed_packet=64M
