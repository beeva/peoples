# Restore a .sql dump into the managed database, once, from a runner.
#
# For the first load of the archive when you would rather not install a MySQL
# client locally -- and for restoring a nightly backup.yml artifact after a
# mistake. Deliberately manual: it drops and recreates what it restores.
name: seed database

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release holding the .sql (or .sql.gz) asset"
        type: string
        required: true
        default: db-seed

jobs:
  seed:
    runs-on: ubuntu-latest
    # A restore replaces the archive. Two at once would interleave their
    # statements into something that is neither dump.
    concurrency:
      group: seed-database
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the dump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern '*.sql*' --dir /tmp/seed
          ls -lh /tmp/seed
          # Both shapes are accepted: backup.yml writes .sql.gz, a hand-made
          # dump is usually plain .sql.
          for f in /tmp/seed/*.gz; do [ -e "$f" ] && gunzip -f "$f"; done
          ls -lh /tmp/seed

      - name: Restore
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PWD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          sql=$(ls /tmp/seed/*.sql | head -1)
          echo "restoring $sql"
          # --max-allowed-packet on the client is only half of it: the *server*
          # must allow it too, or a large INSERT fails part-way through. See
          # DEPLOY.md on raising mysql.max_allowed_packet on the service.
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" \
                --user="$MYSQL_USER" \
                --ssl-mode=REQUIRED \
                --default-character-set=utf8mb4 \
                --max-allowed-packet=64M \
                "$MYSQL_DATABASE" < "$sql"

      - name: Row counts after the restore
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_SSL: "1"
        run: |
          pip install -r requirements.txt
          python dbdump.py status
