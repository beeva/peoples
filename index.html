<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>three.js Email Directory</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-soft: #11141c;
    --surface: #161a24;
    --surface-2: #1c212e;
    --border: #262c3a;
    --border-soft: #20252f;
    --text: #e7ebf3;
    --text-dim: #9aa3b5;
    --text-faint: #69728a;
    --accent: #6ea8fe;
    --accent-2: #b794f6;
    --accent-grad: linear-gradient(135deg, #6ea8fe 0%, #b794f6 100%);
    --good: #4ade80;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    --radius: 16px;
    --radius-sm: 10px;
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb;
    --bg-soft: #eef1f8;
    --surface: #ffffff;
    --surface-2: #f7f9fd;
    --border: #e2e7f0;
    --border-soft: #eaeef5;
    --text: #1a1f2b;
    --text-dim: #5a6477;
    --text-faint: #8a93a6;
    --accent: #3b82f6;
    --accent-2: #8b5cf6;
    --shadow: 0 8px 30px rgba(40, 60, 110, 0.10);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar-inner {
    max-width: 1080px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--accent-grad);
    display: grid; place-items: center;
    box-shadow: 0 4px 14px rgba(110, 168, 254, 0.35);
    flex: none;
  }
  .logo svg { width: 22px; height: 22px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; font-weight: 650; }
  .brand p { font-size: 12.5px; margin: 0; color: var(--text-faint); }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 11px; flex: none;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); cursor: pointer; display: grid; place-items: center;
    transition: all .18s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn svg { width: 19px; height: 19px; }

  /* ---------- Hero stats ---------- */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; position: relative; overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; inset: 0; opacity: .06;
    background: var(--accent-grad);
  }
  .stat .num { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .stat .lbl { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; }

  /* ---------- Toolbar (tabs + rescrape) ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .toolbar .tabs { margin-bottom: 0; }
  .rescrape { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rescrape-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .16s ease;
  }
  .rescrape-btn:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
  .rescrape-btn:disabled { opacity: .7; cursor: default; }
  .rescrape-btn svg { width: 15px; height: 15px; }
  .stop-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, #f87171 45%, var(--border));
    background: color-mix(in srgb, #f87171 12%, var(--surface));
    color: #f87171; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .16s ease;
  }
  .stop-btn:hover { border-color: #f87171; background: color-mix(in srgb, #f87171 20%, var(--surface)); }
  .stop-btn svg { width: 12px; height: 12px; }
  .rescrape-status { font-size: 12.5px; color: var(--text-faint); }
  .rescrape-status[data-state="running"] { color: var(--accent); }
  .rescrape-status[data-state="error"] { color: #f87171; }
  .rescrape-status[data-state="stopped"] { color: #fbbf24; }
  .rescrape-status[data-state="done"] { color: var(--good); }
  .spin-mini-inline {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent); animation: spin .8s linear infinite;
  }

  /* ---------- Category tabs ---------- */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); font-size: 13.5px; font-weight: 550; cursor: pointer;
    transition: all .16s ease;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent-grad); color: #fff; border-color: transparent; }
  .tab-count {
    font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--text) 10%, transparent); color: inherit;
  }
  .tab.active .tab-count { background: rgba(255,255,255,.25); }

  /* ---------- Source badge ---------- */
  .src-badge {
    flex: none; font-size: 11px; font-weight: 650; letter-spacing: .01em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
  }
  .src-badge[data-source="discourse"] { color:#6ea8fe; border-color:color-mix(in srgb,#6ea8fe 45%,transparent); background:color-mix(in srgb,#6ea8fe 12%,transparent); }
  .src-badge[data-source="devto"] { color:#b794f6; border-color:color-mix(in srgb,#b794f6 45%,transparent); background:color-mix(in srgb,#b794f6 12%,transparent); }
  .src-badge[data-source="aboutme"] { color:#4ade80; border-color:color-mix(in srgb,#4ade80 45%,transparent); background:color-mix(in srgb,#4ade80 12%,transparent); }

  /* ---------- Card meta / tags / external links ---------- */
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 12px; font-size: 12.5px; color: var(--text-faint); }
  .card-meta .meta-bit { display: inline-flex; align-items: center; gap: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag { font-size: 11.5px; color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border-soft); padding: 2px 9px; border-radius: 999px; }
  .ext-links { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .ext-links a { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); }
  .ext-links a:hover { color: var(--accent); text-decoration: none; }
  .ext-links svg { width: 13px; height: 13px; flex: none; }

  /* ---------- Controls ---------- */
  .controls {
    display: flex; gap: 12px; align-items: center; margin-bottom: 22px; flex-wrap: wrap;
  }
  .search {
    position: relative; flex: 1; min-width: 240px;
  }
  .search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--text-faint); pointer-events: none;
  }
  .search input {
    width: 100%; padding: 13px 14px 13px 44px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 14.5px; outline: none; transition: border-color .18s, box-shadow .18s;
  }
  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  select.sort {
    padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; outline: none;
  }
  select.sort:focus { border-color: var(--accent); }

  .result-meta { font-size: 13px; color: var(--text-faint); margin: -6px 2px 16px; }
  .result-meta b { color: var(--text-dim); font-weight: 600; }

  /* ---------- Cards ---------- */
  .grid { display: grid; gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px;
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); box-shadow: var(--shadow); }

  .card-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff;
  }
  .who { min-width: 0; flex: 1; }
  .who .name { font-weight: 620; font-size: 14.5px; }
  .who .handle { font-size: 12.5px; color: var(--text-faint); }
  .when { font-size: 12.5px; color: var(--text-faint); white-space: nowrap; padding-top: 3px; }

  .topic {
    display: inline-block; font-size: 13px; font-weight: 600; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
  }
  .topic:hover { border-color: var(--accent); text-decoration: none; }

  .emails { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .email-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    color: var(--text); border-radius: 999px; padding: 5px 6px 5px 13px;
    font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .email-chip a { color: var(--text); }
  .copy-btn {
    border: none; background: transparent; cursor: pointer; color: var(--text-dim);
    width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
    transition: background .15s, color .15s;
  }
  .copy-btn:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text); }
  .copy-btn.done { color: var(--good); }
  .copy-btn svg { width: 15px; height: 15px; }

  .preview {
    font-size: 13.5px; color: var(--text-dim);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-foot {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 16px; font-size: 12.5px;
  }
  .card-foot a { color: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; }
  .card-foot a:hover { color: var(--accent); text-decoration: none; }
  .card-foot svg { width: 14px; height: 14px; }

  mark { background: color-mix(in srgb, var(--accent) 38%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

  /* ---------- Pagination ---------- */
  .pager { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 34px; flex-wrap: wrap; }
  .pager button {
    min-width: 40px; height: 40px; padding: 0 12px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    font-size: 14px; cursor: pointer; transition: all .15s;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  .pager button.active {
    background: var(--accent-grad); color: #fff; border-color: transparent; font-weight: 650;
  }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager .gap { color: var(--text-faint); padding: 0 4px; }

  /* ---------- States ---------- */
  .empty, .loading {
    text-align: center; padding: 70px 20px; color: var(--text-faint);
  }
  .empty svg { width: 46px; height: 46px; margin-bottom: 14px; opacity: .5; }
  .skeleton { animation: pulse 1.4s ease-in-out infinite; }
  .skeleton .card { pointer-events: none; }
  .sk-line { height: 12px; border-radius: 6px; background: var(--surface-2); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  .spinner {
    width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 14px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 11px 18px; border-radius: 12px; box-shadow: var(--shadow);
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 100;
    display: flex; align-items: center; gap: 9px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast svg { width: 17px; height: 17px; color: var(--good); }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .brand p { display: none; }
    .when { display: none; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>
          </svg>
        </div>
        <div>
          <h1>Contact Directory</h1>
          <p id="subtitle">Contacts scraped from three.js, dev.to &amp; about.me</p>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Data source"></div>
      <div class="rescrape" id="rescrape" hidden></div>
    </div>
    <section class="stats" id="stats"></section>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search by email, name, topic or content…" autocomplete="off" />
      </div>
      <select class="sort" id="sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>

    <div class="result-meta" id="resultMeta"></div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span id="toastMsg">Copied</span>
  </div>

<script>
(() => {
  "use strict";
  const PER_PAGE = 12;
  const state = { page: 1, q: "", sort: "newest", source: "all", noun: "Records", total: 0, pages: 1 };

  const SOURCE_LABELS = { discourse: "three.js", devto: "dev.to", aboutme: "about.me" };
  const ORIGIN_LABEL = { discourse: "View original post", devto: "View job post", aboutme: "View profile" };

  const $ = (id) => document.getElementById(id);
  const grid = $("grid"), pager = $("pager"), resultMeta = $("resultMeta"), tabsEl = $("tabs");

  // ---- helpers ----
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const terms = q.trim().split(/\s+/).filter(Boolean)
      .map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (!terms.length) return safe;
    return safe.replace(new RegExp("(" + terms.join("|") + ")", "gi"), "<mark>$1</mark>");
  }

  const AV_COLORS = [
    ["#6ea8fe", "#3b6fd4"], ["#b794f6", "#7c54c9"], ["#4ade80", "#22a35a"],
    ["#f472b6", "#c43d82"], ["#fbbf24", "#d18d09"], ["#38bdf8", "#0a82bd"],
  ];
  function avatarStyle(seed) {
    let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    const [a, b] = AV_COLORS[h % AV_COLORS.length];
    return `background:linear-gradient(135deg,${a},${b});`;
  }

  function relDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  let toastTimer;
  function toast(msg) {
    $("toastMsg").textContent = msg;
    const t = $("toast"); t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---- rendering ----
  function statCard(num, lbl) {
    return `<div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
  }

  function renderStats(s) {
    if (!s) return;
    state.noun = s.noun || "Records";
    const range = s.earliest && s.latest ? `${s.earliest} – ${s.latest}` : "—";
    $("stats").innerHTML =
      statCard(s.total_posts.toLocaleString(), esc(state.noun)) +
      statCard(s.unique_emails.toLocaleString(), "Unique emails") +
      statCard(s.total_emails.toLocaleString(), "Email mentions") +
      statCard(range, "Date range");
  }

  function renderTabs(sources) {
    if (!sources) return;
    tabsEl.innerHTML = sources.map((s) =>
      `<button class="tab${s.key === state.source ? " active" : ""}" role="tab"
        aria-selected="${s.key === state.source}" data-source="${esc(s.key)}">
        ${esc(s.label)}<span class="tab-count">${(s.count || 0).toLocaleString()}</span>
      </button>`).join("");
    // update subtitle to reflect the active source
    const active = sources.find((s) => s.key === state.source);
    const sub = $("subtitle");
    if (active && sub) {
      sub.textContent = active.key === "all"
        ? "Contacts scraped from three.js, dev.to & about.me"
        : `Contacts from ${active.label}`;
    }
  }

  // ---- rescrape ----
  let scrapePoll = null;

  function relTimeAgo(iso) {
    if (!iso) return "never";
    const t = new Date(iso).getTime();
    if (isNaN(t)) return "never";
    const secs = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (secs < 60) return "just now";
    const m = Math.round(secs / 60);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60);
    if (h < 24) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }

  function setScrapeStatus(text, st) {
    const el = $("rescrapeStatus");
    if (el) { el.textContent = text; el.dataset.state = st || ""; }
  }

  function setScraping(on) {
    const btn = $("rescrapeBtn"); if (btn) btn.disabled = on;
    const stop = $("stopBtn"); if (stop) stop.hidden = !on;
  }

  function renderRescrape(sources) {
    const box = $("rescrape");
    if (!box) return;
    if (state.source === "all") { box.hidden = true; box.innerHTML = ""; return; }
    const active = sources.find((s) => s.key === state.source);
    const label = active ? active.label : state.source;
    box.hidden = false;
    box.innerHTML =
      `<button class="rescrape-btn" id="rescrapeBtn" title="Re-scrape ${esc(label)} (only fetches new content)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Rescrape ${esc(label)}</button>
       <button class="stop-btn" id="stopBtn" title="Stop scraping (keeps what was collected)" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        Stop</button>
       <span class="rescrape-status" id="rescrapeStatus"></span>`;
    $("rescrapeBtn").addEventListener("click", triggerScrape);
    $("stopBtn").addEventListener("click", stopScrape);
    fetchScrapeStatus().then(applyScrapeStatus);
  }

  async function fetchScrapeStatus() {
    try {
      const res = await fetch("/api/scrape/status?source=" + encodeURIComponent(state.source));
      return await res.json();
    } catch { return { status: "idle" }; }
  }

  function applyScrapeStatus(s) {
    if (!s) return;
    if (s.status === "running") {
      setScraping(true);
      setScrapeStatus(s.added != null ? `Scraping… +${s.added} new` : "Scraping…", "running");
      pollScrape();  // guarded against duplicate intervals
    } else if (s.status === "error") {
      setScraping(false);
      setScrapeStatus("Error: " + (s.message || s.error || "failed"), "error");
    } else if (s.status === "stopped") {
      setScraping(false);
      setScrapeStatus("Stopped · +" + (s.added != null ? s.added : 0) + " new", "stopped");
    } else if (s.status === "done" && s.added != null) {
      setScraping(false);
      setScrapeStatus(`+${s.added} new · ${relTimeAgo(s.last_run)}`, "done");
    } else {
      setScraping(false);
      setScrapeStatus("Last scraped " + relTimeAgo(s.last_run), "");
    }
  }

  async function triggerScrape() {
    setScraping(true);
    setScrapeStatus("Scraping…", "running");
    try {
      const res = await fetch("/api/scrape?source=" + encodeURIComponent(state.source), { method: "POST" });
      const data = await res.json();
      if (!data.ok && data.error && data.error !== "already running") {
        setScraping(false);
        setScrapeStatus("Error: " + data.error, "error");
        return;
      }
      pollScrape();
    } catch (e) {
      setScraping(false);
      setScrapeStatus("Error: " + e.message, "error");
    }
  }

  async function stopScrape() {
    setScrapeStatus("Stopping…", "running");
    try {
      await fetch("/api/scrape/stop?source=" + encodeURIComponent(state.source), { method: "POST" });
    } catch { /* the poller will reflect the final state */ }
  }

  function pollScrape() {
    if (scrapePoll) return;  // single owner -- avoid stacking intervals
    scrapePoll = setInterval(async () => {
      const s = await fetchScrapeStatus();
      if (s.status === "running") {
        setScraping(true);
        setScrapeStatus(s.added != null ? `Scraping… +${s.added} new` : "Scraping…", "running");
        liveRefresh();  // stream new records into the grid + stats (no re-render of controls)
      } else {
        clearInterval(scrapePoll); scrapePoll = null;
        const added = s.added != null ? s.added : (s.last_added != null ? s.last_added : 0);
        toast(s.status === "error" ? "Scrape failed"
              : s.status === "stopped" ? ("Stopped · +" + added + " new")
              : ("Added " + added + " new"));
        load(); // full refresh: data + tab counts + control status
      }
    }, 1500);
  }

  function copyIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  }

  function extIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>`;
  }

  function hostOf(url) {
    try { return new URL(url).host.replace(/^www\./, ""); } catch { return url; }
  }

  function cardHTML(r, q) {
    const src = r.source || "";
    const display = r.name || r.username || "Unknown";
    const initial = esc((display.trim()[0] || "?").toUpperCase());
    const emails = (r.emails || []).map((e) => `
      <span class="email-chip">
        <a href="mailto:${esc(e)}">${highlight(e, q)}</a>
        <button class="copy-btn" data-copy="${esc(e)}" title="Copy email" aria-label="Copy ${esc(e)}">${copyIcon()}</button>
      </span>`).join("");

    const handle = r.username ? "@" + esc(r.username) : esc(SOURCE_LABELS[src] || src);

    const metaBits = [];
    if (r.organization) metaBits.push(`<span class="meta-bit">🏢 ${highlight(r.organization, q)}</span>`);
    if (r.location) metaBits.push(`<span class="meta-bit">📍 ${highlight(r.location, q)}</span>`);
    const dt = relDate(r.created_at);
    if (dt) metaBits.push(`<span class="meta-bit">🗓 ${dt}</span>`);
    const meta = metaBits.length ? `<div class="card-meta">${metaBits.join("")}</div>` : "";

    const title = r.title
      ? `<a class="topic" href="${esc(r.url || "#")}" target="_blank" rel="noopener" title="${esc(r.title)}">${highlight(r.title, q)}</a>`
      : "";

    const tags = (r.tags && r.tags.length)
      ? `<div class="tags">${r.tags.slice(0, 6).map((t) => `<span class="tag">#${esc(t)}</span>`).join("")}</div>`
      : "";

    const extra = [].concat(
      (r.apply_links || []).map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${extIcon()} Apply · ${esc(hostOf(u))}</a>`),
      (r.messaging || []).map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${extIcon()} Message · ${esc(hostOf(u))}</a>`),
    );
    const extLinks = extra.length ? `<div class="ext-links">${extra.join("")}</div>` : "";

    return `
      <article class="card">
        <div class="card-top">
          <div class="avatar" style="${avatarStyle(display)}">${initial}</div>
          <div class="who">
            <div class="name">${highlight(display, q)}</div>
            <div class="handle">${handle}</div>
          </div>
          ${src ? `<span class="src-badge" data-source="${esc(src)}">${esc(SOURCE_LABELS[src] || src)}</span>` : ""}
        </div>
        ${meta}
        ${title}
        ${emails ? `<div class="emails">${emails}</div>` : ""}
        ${tags}
        ${r.preview ? `<p class="preview">${highlight(r.preview, q)}</p>` : ""}
        ${extLinks}
        <div class="card-foot">
          ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${extIcon()} ${esc(ORIGIN_LABEL[src] || "View original")}</a>` : ""}
        </div>
      </article>`;
  }

  function skeleton() {
    let cards = "";
    for (let i = 0; i < 6; i++) {
      cards += `<article class="card"><div class="card-top">
        <div class="avatar" style="background:var(--surface-2)"></div>
        <div class="who" style="flex:1">
          <div class="sk-line" style="width:40%;margin-bottom:8px"></div>
          <div class="sk-line" style="width:25%"></div></div></div>
        <div class="sk-line" style="width:55%;margin:14px 0"></div>
        <div class="sk-line" style="width:90%;margin-bottom:8px"></div>
        <div class="sk-line" style="width:75%"></div></article>`;
    }
    grid.className = "grid skeleton";
    grid.innerHTML = cards;
    pager.innerHTML = "";
    resultMeta.textContent = "";
  }

  function renderPager() {
    const { page, pages } = state;
    if (pages <= 1) { pager.innerHTML = ""; return; }
    const btn = (label, p, opts = {}) =>
      `<button ${opts.active ? 'class="active"' : ""} ${opts.disabled ? "disabled" : ""} data-page="${p}">${label}</button>`;

    const nums = [];
    const add = (p) => nums.push(btn(p, p, { active: p === page }));
    const gap = () => nums.push('<span class="gap">…</span>');

    add(1);
    let lo = Math.max(2, page - 1), hi = Math.min(pages - 1, page + 1);
    if (lo > 2) gap();
    for (let p = lo; p <= hi; p++) add(p);
    if (hi < pages - 1) gap();
    if (pages > 1) add(pages);

    pager.innerHTML =
      btn("‹", page - 1, { disabled: page === 1 }) +
      nums.join("") +
      btn("›", page + 1, { disabled: page === pages });
  }

  function emptyState() {
    grid.className = "grid";
    grid.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <div>No results found${state.q ? ` for “${esc(state.q)}”` : ""}.</div>
    </div>`;
  }

  // ---- data ----
  let reqId = 0;

  async function fetchEmails() {
    const params = new URLSearchParams({
      source: state.source, page: state.page, per_page: PER_PAGE, q: state.q, sort: state.sort,
    });
    const res = await fetch("/api/emails?" + params.toString());
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  function renderData(data) {
    state.total = data.total; state.pages = data.total_pages; state.page = data.page;
    if (!data.items.length) { emptyState(); resultMeta.textContent = ""; renderPager(); return; }
    grid.className = "grid";
    grid.innerHTML = data.items.map((r) => cardHTML(r, state.q)).join("");
    const from = (data.page - 1) * data.per_page + 1;
    const to = from + data.items.length - 1;
    const noun = (state.noun || "Records").toLowerCase();
    resultMeta.innerHTML = `Showing <b>${from}–${to}</b> of <b>${data.total.toLocaleString()}</b> ${state.q ? "matching " : ""}${noun}`;
    renderPager();
  }

  async function load() {
    const my = ++reqId;
    skeleton();
    try {
      const data = await fetchEmails();
      if (my !== reqId) return; // stale response
      renderStats(data.stats);
      renderTabs(data.sources);
      renderRescrape(data.sources);
      renderData(data);
    } catch (err) {
      if (my !== reqId) return;
      grid.className = "grid";
      grid.innerHTML = `<div class="empty">⚠️ Failed to load data.<br><small>${esc(err.message)}</small></div>`;
    }
  }

  // Lightweight refresh used while a scrape runs: update the grid + stats only,
  // without rebuilding the tabs/rescrape controls (which would restart polling).
  async function liveRefresh() {
    try {
      const data = await fetchEmails();
      renderStats(data.stats);
      renderData(data);
    } catch { /* keep the last good view */ }
  }

  // ---- events ----
  let debounce;
  $("search").addEventListener("input", (e) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; load(); }, 220);
  });
  $("sort").addEventListener("change", (e) => { state.sort = e.target.value; state.page = 1; load(); });

  tabsEl.addEventListener("click", (e) => {
    const b = e.target.closest(".tab[data-source]");
    if (!b) return;
    const key = b.dataset.source;
    if (key === state.source) return;
    state.source = key; state.page = 1; load();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  pager.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-page]");
    if (!b || b.disabled) return;
    const p = parseInt(b.dataset.page, 10);
    if (p && p !== state.page) { state.page = p; load(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });

  grid.addEventListener("click", async (e) => {
    const b = e.target.closest(".copy-btn");
    if (!b) return;
    try {
      await navigator.clipboard.writeText(b.dataset.copy);
      b.classList.add("done");
      setTimeout(() => b.classList.remove("done"), 1200);
      toast("Copied " + b.dataset.copy);
    } catch { toast("Copy failed"); }
  });

  // theme
  const themeBtn = $("themeBtn");
  const sunIcon = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const moonIcon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("themeIcon").innerHTML = t === "light" ? moonIcon : sunIcon;
    try { localStorage.setItem("theme", t); } catch {}
  }
  themeBtn.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    applyTheme(cur);
  });
  let saved = "dark";
  try { saved = localStorage.getItem("theme") || "dark"; } catch {}
  applyTheme(saved);

  load();
})();
</script>
</body>
</html>
